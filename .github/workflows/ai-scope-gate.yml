
name: AI Scope Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    steps:
      - name: Reject changes outside user-approved files
        uses: actions/github-script@v7
        env:
          AI_ALLOWED_PATHS: ${{ vars.AI_ALLOWED_PATHS }}
        with:
          script: |
            const allowed = new Set((process.env.AI_ALLOWED_PATHS || '')
              .split(',').map(s => s.trim()).filter(Boolean));
            if (allowed.size === 0) {
              core.setFailed('No approved paths. Set repository variable AI_ALLOWED_PATHS before opening the PR.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            if (files.length >= 3000) {
              core.setFailed('Change set too large to verify safely.');
              return;
            }
            const changedPaths = new Set();
            for (const file of files) {
              changedPaths.add(file.filename);
              if (file.previous_filename) changedPaths.add(file.previous_filename);
            }
            const outsideScope = [...changedPaths].filter(path => !allowed.has(path));
            if (outsideScope.length > 0) {
              core.setFailed('Unauthorized file change(s): ' + outsideScope.join(', '));
              return;
            }
            core.info(`Scope passed: ${files.length} changed file(s), all within approved paths.`);
